<div class="cards-page">

  <div class="state-card" *ngIf="isLoading">
    <span class="spinner"></span>
    <strong>Chargement des cartes...</strong>
  </div>

  <div class="state-card state-card--error" *ngIf="errorMessage">
    <strong>Impossible de charger les cartes</strong>
    <span>{{ errorMessage }}</span>
    <button type="button" (click)="loadCards()">Réessayer</button>
  </div>

  <app-card-table
    *ngIf="!isLoading && !errorMessage"
    [cards]="cards"
    (actionCompleted)="loadCards(true)">
  </app-card-table>

</div>
