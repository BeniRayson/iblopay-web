<!-- ICÔNE RÉUTILISABLE -->
<ng-template #icon let-name>
  <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path *ngFor="let d of iconPaths[name]" [attr.d]="d"></path>
  </svg>
</ng-template>


<div class="page">

  <!-- CHARGEMENT -->
  <div class="card card--state" *ngIf="loading">
    <span class="loader__spinner"></span>
    <span>Chargement...</span>
  </div>

  <!-- ==========================================================
       FORMULAIRE — une seule carte de taille moyenne
       ========================================================== -->
  <form *ngIf="!loading && service" class="card" (ngSubmit)="onSubmit()" #editForm="ngForm">

    <header class="card__head">
      <span class="card__avatar" [style.background]="getColor(service.abreviation)">
        {{ getInitials(service.abreviation) }}
      </span>
      <div class="card__title">
        <h1>{{ isNew ? 'Nouveau service' : 'Modifier le service' }}</h1>
        <p>{{ isNew ? 'Renseignez les informations du service.' : 'ID ' + service.id }}</p>
      </div>
    </header>

    <div class="card__body">

      <div class="alert" *ngIf="error" role="alert">
        <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'alert' }"></ng-container>
        <span>{{ error }}</span>
      </div>

      <label class="input">
        <span class="input__label">Nom du service <b>*</b></span>
        <span class="input__box">
          <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'tag' }"></ng-container>
          <input type="text" [(ngModel)]="service.abreviation" name="abreviation" required
                 placeholder="Ex : Transport" />
        </span>
      </label>

      <label class="input">
        <span class="input__label">Date de création</span>
        <span class="input__box">
          <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'calendar' }"></ng-container>
          <input type="date" [ngModel]="dateCreationInput" (ngModelChange)="dateCreationInput = $event"
                 name="dateCreation" />
        </span>
      </label>

      <label class="input">
        <span class="input__label">Description <b>*</b></span>
        <span class="input__box input__box--area">
          <textarea [(ngModel)]="service.description" name="description" rows="3" required
                    placeholder="Décrivez brièvement le service..."></textarea>
        </span>
      </label>

      <label class="input">
        <span class="input__label">Contact du responsable</span>
        <span class="input__box">
          <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'phone' }"></ng-container>
          <input type="text" [(ngModel)]="service.telephone" name="telephone"
                 placeholder="Téléphone ou email du responsable" />
        </span>
      </label>

    </div>

    <footer class="card__foot">
      <button type="button" class="btn btn--outline" (click)="cancel()">
        <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'back' }"></ng-container>
        Retour à la liste
      </button>
      <button type="submit" class="btn btn--soft" [disabled]="editForm.invalid">
        <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'save' }"></ng-container>
        {{ isNew ? 'Créer le service' : 'Enregistrer' }}
      </button>
    </footer>

  </form>

  <!-- INTROUVABLE -->
  <div class="card card--state" *ngIf="!loading && !service">
    <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'search' }"></ng-container>
    <h3>Service introuvable</h3>
    <p>Ce service n'existe pas ou a été supprimé.</p>
    <button type="button" class="btn btn--outline" (click)="goBack()">
      <ng-container *ngTemplateOutlet="icon; context: { $implicit: 'back' }"></ng-container>
      Retour à la liste
    </button>
  </div>

</div>
