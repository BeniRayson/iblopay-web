<section class="login-page">

  <div class="background">
    <div class="background-grid"></div>

    <div class="glow glow-left"></div>
    <div class="glow glow-right"></div>

    <div class="corner corner-top">
      <span class="corner-cyan"></span>
      <span class="corner-blue"></span>
    </div>

    <div class="corner corner-bottom">
      <span class="corner-cyan"></span>
      <span class="corner-blue"></span>
    </div>
  </div>

  <main class="login-card">

    <div class="logo-area">

      <div class="logo-wrapper">

        <img
          src="assets/images/logo_iblo.jpeg"
          alt="IBLOTEC">

      </div>

    </div>

    <header class="login-header">

      <h1>
        Connexion
        <span>administrateur</span>
      </h1>

      <p>
        Accédez à votre espace de gestion
        IBLOPAY en toute sécurité.
      </p>

    </header>

    <div
      class="alert alert-error"
      *ngIf="errorMessage">

      <div class="alert-icon">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>

      <div>
        {{ errorMessage }}
      </div>

    </div>

    <div
      class="alert alert-warning"
      *ngIf="sessionExpired">

      <div class="alert-icon">
        <i class="fa-regular fa-clock"></i>
      </div>

      <div>
        Votre session a expiré.
        Veuillez vous reconnecter.
      </div>

    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()">

      <div
        class="form-group"
        [class.has-error]="
          loginForm.get('phone_number')?.invalid &&
          loginForm.get('phone_number')?.touched
        ">

        <label for="phone_number">

          <i class="fa-solid fa-user"></i>

          Identification

        </label>

        <div class="input-wrapper">

          <span class="input-icon">

            <i class="fa-solid fa-user"></i>

          </span>

          <input
            id="phone_number"
            type="text"
            formControlName="phone_number"
            placeholder="Entrez votre identifiant"
            autocomplete="tel">

        </div>

        <div
          class="field-error"
          *ngIf="
            loginForm.get('phone_number')?.touched &&
            loginForm.get('phone_number')?.invalid
          ">

          <i class="fa-solid fa-circle-exclamation"></i>

          {{ getFieldError('phone_number') }}

        </div>

      </div>

      <div
        class="form-group"
        [class.has-error]="
          loginForm.get('pin')?.invalid &&
          loginForm.get('pin')?.touched
        ">

        <label for="pin">

          <i class="fa-solid fa-lock"></i>

          Mot de passe

        </label>

        <div class="input-wrapper">

          <span class="input-icon">

            <i class="fa-solid fa-lock"></i>

          </span>

          <input
            id="pin"
            [type]="showPin ? 'text' : 'password'"
            formControlName="pin"
            placeholder="Entrez votre mot de passe"
            autocomplete="current-password">

          <button
            type="button"
            class="toggle-pin"
            (click)="togglePinVisibility()"
            [attr.aria-label]="
              showPin
                ? 'Masquer le mot de passe'
                : 'Afficher le mot de passe'
            ">

            <i
              [class]="
                showPin
                  ? 'fa-regular fa-eye-slash'
                  : 'fa-regular fa-eye'
              ">
            </i>

          </button>

        </div>

        <div
          class="field-error"
          *ngIf="
            loginForm.get('pin')?.touched &&
            loginForm.get('pin')?.invalid
          ">

          <i class="fa-solid fa-circle-exclamation"></i>

          {{ getFieldError('pin') }}

        </div>

      </div>

      <button
        type="submit"
        class="login-button"
        [class.loading]="isLoading"
        [disabled]="isLoading">

        <ng-container *ngIf="!isLoading">

          <span>
            Se connecter
          </span>

          

        </ng-container>

        <ng-container *ngIf="isLoading">

          <span class="spinner"></span>

          <span>
            Connexion en cours...
          </span>

        </ng-container>

      </button>

    </form>

    <footer class="login-footer">

      <div>

        <i class="fa-solid fa-shield-halved"></i>

        Accès sécurisé à l'administration IBLOPAY

      </div>

      <p>
        © {{ currentYear }} IBLOTEC
      </p>

    </footer>

  </main>

</section>
