<div class="login-page">
  <section class="login-visual" aria-label="Bienvenue sur la plateforme de suivi des bus et des taxis">
    <img src="assets/images/login.png" alt="Bus et taxi : bienvenue sur votre plateforme" />
  </section>

  <main class="login-form-side">
    <div class="decor-circle" aria-hidden="true"></div>
    <div class="decor-wave" aria-hidden="true"></div>

    <section class="login-card" aria-labelledby="login-title">
      <header class="card-heading">
        <div class="card-heading-icon" aria-hidden="true"><i class="fa-solid fa-bus-simple"></i></div>
        <h1 id="login-title">Bienvenue sur <span>IBLOPAY</span></h1>
        <p>Connectez-vous à votre espace de gestion.</p>
      </header>

      <form (ngSubmit)="seConnecter()" #loginForm="ngForm" novalidate>
        <div class="form-field">
          <label for="identifiant">Identifiants</label>
          <div class="input-shell">
            <i class="fa-regular fa-user" aria-hidden="true"></i>
            <input
              id="identifiant"
              name="identifiant"
              type="text"
              [(ngModel)]="identifiant"
              required
              autocomplete="username"
              placeholder="Entrez vos identifiants"
              [disabled]="chargement"
              [attr.aria-invalid]="tentative && !identifiant.trim() ? 'true' : null"
            />
          </div>
          <small class="field-error" *ngIf="tentative && !identifiant.trim()">
            Saisissez vos identifiants.
          </small>
        </div>

        <div class="form-field">
          <label for="motDePasse">Mot de passe</label>
          <div class="input-shell">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <input
              id="motDePasse"
              name="motDePasse"
              [type]="motDePasseVisible ? 'text' : 'password'"
              [(ngModel)]="motDePasse"
              required
              autocomplete="current-password"
              placeholder="Entrez votre mot de passe"
              [disabled]="chargement"
              [attr.aria-invalid]="tentative && !motDePasse ? 'true' : null"
            />
            <button
              type="button"
              class="reveal-btn"
              [disabled]="chargement"
              (click)="motDePasseVisible = !motDePasseVisible"
              [attr.aria-label]="motDePasseVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <i class="fa-regular" [class.fa-eye]="!motDePasseVisible" [class.fa-eye-slash]="motDePasseVisible"></i>
            </button>
          </div>
          <small class="field-error" *ngIf="tentative && !motDePasse">
            Saisissez votre mot de passe.
          </small>
        </div>

        <p *ngIf="erreur" class="login-error" role="alert">{{ erreur }}</p>

        <button type="submit" class="submit-btn" [disabled]="chargement">
          {{ chargement ? 'Connexion en cours…' : 'Se connecter' }}
        </button>
      </form>
    </section>

    <p class="copyright">© IBLOPAY · Gestion du transport</p>
  </main>
</div>
